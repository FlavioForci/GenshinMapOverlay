# macOS-Build (Apple Silicon) auf einem GitHub-Mac, hängt die ZIP ans Release.
# Start: Actions → macOS build → Run workflow (oder: gh workflow run mac.yml -f tag=v1.1.0)
name: macOS build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release, an das die Mac-Version angehängt wird
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Cache Electron downloads and packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-v1-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci --no-fund

      - name: Verify progress and transfers
        run: |
          npm run test:progress
          npm run test:transfer
          npm run build:transfer-scripts
          git diff --exit-code -- src/transfer/scripts

      - name: App bauen
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged transfer files
        run: |
          TRANSFER_CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$TRANSFER_CHECK_DIR"' EXIT
          node node_modules/@electron/asar/bin/asar.js extract "dist/mac-arm64/Genshin Map Overlay.app/Contents/Resources/app.asar" "$TRANSFER_CHECK_DIR/app"
          npm run check:transfer-package -- "$TRANSFER_CHECK_DIR/app"

      # Ohne Apple-Entwicklerkonto: Ad-hoc-Signatur, sonst startet die App auf Apple Silicon nicht
      - name: Signieren und packen
        run: |
          APP="dist/mac-arm64/Genshin Map Overlay.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --keepParent "$APP" "GenshinMapOverlay-$VERSION-mac-arm64.zip"
          ls -la GenshinMapOverlay-*-mac-arm64.zip

      - name: Ans Release hängen
        run: gh release upload "${{ inputs.tag }}" GenshinMapOverlay-*-mac-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
