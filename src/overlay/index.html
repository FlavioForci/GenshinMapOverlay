<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'">
  <title>Genshin Map Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- data-i18n*: Texte kommen zur Laufzeit (shared/i18n.js) -->
  <canvas id="markers"></canvas>

  <div id="tooltip" class="tooltip" hidden>
    <strong id="tooltip-name"></strong>
    <span id="tooltip-hint"></span>
  </div>

  <div id="hud" class="hud" hidden>
    <span id="hud-text"></span>
    <span class="hud-bar"><span id="hud-progress"></span></span>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="nearby" class="nearby" hidden>
    <img id="nearby-icon" alt="">
    <div class="nearby-text"><strong id="nearby-name"></strong><span id="nearby-action"></span></div>
  </div>

  <button id="panel-handle" class="panel-handle" type="button" hidden data-i18n-title="ui.handleTitle" data-i18n-aria="ui.handleTitle">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <span data-i18n="ui.handle"></span>
  </button>

  <!-- Fundort-Karte: Fotos/Video aus den Kommentaren zum angeklickten Marker -->
  <aside id="spot" class="panel spot" aria-live="polite">
    <header class="panel-head">
      <div class="title">
        <img id="spot-icon" alt="" width="28" height="28">
        <span id="spot-name"></span>
      </div>
      <button id="close-spot" class="close-btn" type="button" data-i18n-title="spot.close" data-i18n-aria="spot.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.1 6.3 13.4 12l5.7 5.7-1.4 1.4-5.7-5.7-5.7 5.7-1.4-1.4 5.7-5.7-5.7-5.7 1.4-1.4 5.7 5.7 5.7-5.7z"/></svg>
      </button>
    </header>
    <div id="spot-body" class="panel-scroll"></div>
    <div class="spot-actions">
      <button id="spot-found" class="gi-btn" type="button"></button>
    </div>
  </aside>

  <aside id="panel" class="panel" data-i18n-aria="ui.title">
    <header class="panel-head">
      <div class="title">
        <img src="../../assets/icon.png" alt="" width="22" height="22">
        <span data-i18n="ui.title"></span>
      </div>
      <button id="close-panel" class="close-btn" type="button" data-i18n-title="ui.closePanel" data-i18n-aria="ui.closePanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.1 6.3 13.4 12l5.7 5.7-1.4 1.4-5.7-5.7-5.7 5.7-1.4-1.4 5.7-5.7-5.7-5.7 1.4-1.4 5.7 5.7 5.7-5.7z"/></svg>
      </button>
    </header>

    <div id="panel-main" class="panel-scroll">
      <div id="status" class="pill status" data-state="search">
        <span class="dot"></span>
        <span id="status-text"></span>
      </div>

      <label class="pill setting">
        <span class="setting-name" data-i18n="ui.hideFound"></span>
        <kbd id="kbd-found"></kbd>
        <input id="hide-found" type="checkbox">
      </label>

      <div class="section-head">
        <h2 data-i18n="ui.sectionMarkers"></h2>
        <span id="enabled-count"></span>
        <button id="none" class="link-btn" type="button" data-i18n="ui.none"></button>
      </div>
      <input id="search" class="search" type="search" data-i18n-placeholder="ui.search" autocomplete="off" spellcheck="false">
      <!-- Kacheln, die offene Liste steht hinter der letzten Kachel ihrer Reihe -->
      <div id="categories" class="cat-grid"></div>
      <div id="results" class="results" hidden></div>
    </div>

    <!-- Einstellungen: ersetzt die Liste, Kopf und Fuß bleiben -->
    <div id="settings-view" class="panel-scroll" hidden>
      <div class="section-head"><h2 data-i18n="ui.sectionDisplay"></h2></div>
      <label class="pill setting">
        <span class="setting-name" data-i18n="ui.opacity"></span>
        <output id="opacity-value" class="value-box"></output>
        <input id="opacity" type="range" min="20" max="100" step="5">
      </label>
      <label class="pill setting">
        <span class="setting-name" data-i18n="ui.size"></span>
        <output id="size-value" class="value-box"></output>
        <input id="size" type="range" min="14" max="48" step="2">
      </label>
      <label class="pill setting" data-i18n-title="ui.showInCapturesHint">
        <span class="setting-name" data-i18n="ui.showInCaptures"></span>
        <input id="show-captures" type="checkbox">
      </label>
      <label class="pill setting" data-i18n-title="ui.minimapHint">
        <span class="setting-name" data-i18n="ui.minimap"></span>
        <input id="minimap" type="checkbox">
      </label>

      <div class="section-head">
        <h2 data-i18n="ui.sectionKeys"></h2>
        <button id="keys-reset" class="link-btn" type="button" data-i18n="ui.keysReset"></button>
      </div>
      <div id="key-list"></div>
      <p id="key-hint" class="hint"></p>

      <div class="section-head"><h2 data-i18n="ui.sectionData"></h2></div>
      <div class="pill info-row">
        <span id="data-info" class="setting-name" data-i18n="ui.loadingData"></span>
        <button id="refresh" class="pill-btn" type="button" data-i18n="ui.refresh"></button>
      </div>
    </div>

    <footer class="panel-foot">
      <button id="switch-profile" class="foot-btn profile-btn" type="button" data-i18n-title="ui.switchProfile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
        <span class="foot-text"><small data-i18n="ui.profileLabel"></small><span id="profile-info"></span></span>
        <svg class="swap" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3 1.4-1.4L21.8 8l-5.4 5.4L15 12l3-3H7zm10 10H6l3 3-1.4 1.4L2.2 16l5.4-5.4L9 12l-3 3h11z"/></svg>
      </button>
      <button id="open-settings" class="foot-btn settings-btn" type="button">
        <svg class="icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
        <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.1 7.1 0 0 0 0-1.88l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.1 7.1 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span id="settings-label" data-i18n="ui.settings"></span>
      </button>
    </footer>
  </aside>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="">
    <span data-i18n="spot.lightboxClose"></span>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/media.js"></script>
  <script src="../shared/hud.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
